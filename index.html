<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hyw</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    color: #e9e9ec;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #t {
    font-size: 2rem;
    letter-spacing: .08em;
    padding: .6em 1.1em;
    border-radius: 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, background .25s ease, opacity .25s ease;
  }
  #t:hover { background: rgba(255,255,255,.06); }
  #t:active { transform: scale(.94); }
  #t.flash { opacity: .45; }
</style>
</head>
<body>
<div id="t">hyw</div>
<script>
(function () {
  var K = 0x5a;
  var P = [
    "207377",
    "770f19",
    "12030d",
    "292a2833343d0529373d"
  ];

  var el = document.getElementById("t");
  var last = -1;

  function unpack(hex) {
    var out = "";
    for (var i = 0; i < hex.length; i += 2) {
      out += String.fromCharCode(parseInt(hex.substr(i, 2), 16) ^ K);
    }
    return out;
  }

  function pick() {
    var i;
    do {
      i = Math.floor(Math.random() * P.length);
    } while (P.length > 1 && i === last);
    last = i;
    return unpack(P[i]);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {
        legacyCopy(text);
      });
    } else {
      legacyCopy(text);
    }
  }

  function flash() {
    el.classList.add("flash");
    setTimeout(function () { el.classList.remove("flash"); }, 120);
  }

  el.addEventListener("click", function () {
    copy(pick());
    flash();
  });
})();
</script>
</body>
</html>
